<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0F14">
<link rel="manifest" href="manifest.json">
<title>Prépa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#0B0F14;
    --bg-elevated:#11161D;
    --line:#1E2530;
    --text:#E7ECF2;
    --text-dim:#8A94A3;
    --accent:#3DDC97;
    --accent-dim:#1F7A56;
    --rouge:#FF5D5D;
    --orange:#FFA53D;
    --vert:#3DDC97;
    --gris:#3A4250;
    --font-display:'Space Grotesk', system-ui, sans-serif;
    --font-body:-apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    --font-data:'JetBrains Mono', 'SF Mono', monospace;
  }
  @font-face{
    font-family:'Space Grotesk';
    src:local('Space Grotesk');
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:var(--font-body);
    overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
  }
  input{ -webkit-user-select:text; user-select:text; }
  #app{ display:flex; flex-direction:column; height:100vh; height:100dvh; }

  /* ---------- LOGIN ---------- */
  #login-screen{
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    height:100%; padding:32px; gap:28px;
  }
  .brand-pulse{
    width:64px; height:64px;
  }
  .brand-title{
    font-family:var(--font-display); font-weight:700; font-size:28px;
    letter-spacing:-0.02em; color:var(--text);
  }
  .brand-sub{
    font-size:13px; color:var(--text-dim); letter-spacing:0.08em; text-transform:uppercase;
    margin-top:-16px;
  }
  .login-form{ width:100%; max-width:340px; display:flex; flex-direction:column; gap:12px; }
  .login-form input{
    background:var(--bg-elevated); border:1px solid var(--line); color:var(--text);
    padding:14px 16px; border-radius:10px; font-size:16px; font-family:var(--font-body);
  }
  .login-form input:focus{ outline:none; border-color:var(--accent); }
  .btn-primary{
    background:var(--accent); color:#04140D; border:none; padding:14px;
    border-radius:10px; font-size:15px; font-weight:600; font-family:var(--font-body);
    cursor:pointer; margin-top:4px;
  }
  .btn-primary:active{ opacity:0.85; }
  .login-error{ color:var(--rouge); font-size:13px; text-align:center; min-height:16px; }

  /* ---------- HEADER ---------- */
  #main-header{
    padding:18px 20px 14px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
    flex-shrink:0;
  }
  #main-header h1{
    font-family:var(--font-display); font-size:19px; font-weight:600; margin:0;
    letter-spacing:-0.01em;
  }
  #main-header .cat-label{
    font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em;
  }

  /* ---------- CONTENT ---------- */
  #content{ flex:1; overflow-y:auto; padding:16px 16px 90px; -webkit-overflow-scrolling:touch; }

  .section-empty{
    text-align:center; color:var(--text-dim); padding:60px 24px; font-size:14px; line-height:1.6;
  }

  /* player row */
  .player-row{
    display:flex; align-items:center; gap:12px;
    background:var(--bg-elevated); border:1px solid var(--line);
    border-radius:12px; padding:14px 16px; margin-bottom:8px;
  }
  .badge-dot{
    width:11px; height:11px; border-radius:50%; flex-shrink:0;
  }
  .badge-dot.rouge{ background:var(--rouge); box-shadow:0 0 8px rgba(255,93,93,0.5); }
  .badge-dot.orange{ background:var(--orange); box-shadow:0 0 8px rgba(255,165,61,0.5); }
  .badge-dot.vert{ background:var(--vert); box-shadow:0 0 8px rgba(61,220,151,0.4); }
  .badge-dot.gris{ background:var(--gris); }
  .player-name{ flex:1; font-size:15px; font-weight:500; }
  .player-meta{ font-size:12px; color:var(--text-dim); font-family:var(--font-data); }

  .summary-strip{
    display:flex; gap:8px; margin-bottom:18px; overflow-x:auto;
  }
  .summary-chip{
    background:var(--bg-elevated); border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; min-width:78px; flex-shrink:0;
  }
  .summary-chip .n{ font-family:var(--font-data); font-size:20px; font-weight:600; }
  .summary-chip .l{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px; }
  .summary-chip.rouge .n{ color:var(--rouge); }
  .summary-chip.orange .n{ color:var(--orange); }
  .summary-chip.gris .n{ color:var(--text-dim); }

  /* ---------- BOTTOM NAV ---------- */
  #bottom-nav{
    position:fixed; bottom:0; left:0; right:0;
    background:rgba(11,15,20,0.92); backdrop-filter:blur(20px);
    border-top:1px solid var(--line);
    display:flex; padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; color:var(--text-dim); padding:6px 2px;
    font-family:var(--font-body); font-size:10.5px; cursor:pointer;
  }
  .nav-btn svg{ width:22px; height:22px; stroke:var(--text-dim); fill:none; stroke-width:1.8; }
  .nav-btn.active{ color:var(--accent); }
  .nav-btn.active svg{ stroke:var(--accent); }

  .hidden{ display:none !important; }

  /* ---------- LISTES / SECTIONS GÉNÉRIQUES ---------- */
  .section-title{
    font-family:var(--font-display); font-size:13px; font-weight:600;
    text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim);
    margin:20px 0 10px;
  }
  .section-title:first-child{ margin-top:0; }
  .list-row{
    display:flex; align-items:center; gap:12px;
    background:var(--bg-elevated); border:1px solid var(--line);
    border-radius:12px; padding:14px 16px; margin-bottom:8px;
  }
  .list-row .main{ flex:1; }
  .list-row .title{ font-size:15px; font-weight:500; }
  .list-row .sub{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .icon-btn{
    background:none; border:none; color:var(--text-dim); padding:6px;
    cursor:pointer;
  }
  .icon-btn svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; }
  .icon-btn.danger{ color:var(--rouge); }

  .fab{
    position:fixed; bottom:96px; right:20px;
    width:52px; height:52px; border-radius:50%;
    background:var(--accent); border:none; color:#04140D;
    font-size:26px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 16px rgba(61,220,151,0.35);
    cursor:pointer; z-index:5;
  }

  .selector-bar{
    display:flex; gap:8px; margin-bottom:16px; overflow-x:auto;
  }
  .selector-chip{
    background:var(--bg-elevated); border:1px solid var(--line); color:var(--text-dim);
    padding:8px 14px; border-radius:20px; font-size:13px; white-space:nowrap;
    cursor:pointer; flex-shrink:0;
  }
  .selector-chip.active{ background:var(--accent-dim); color:var(--accent); border-color:var(--accent); }

  /* ---------- MODAL ---------- */
  #modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    display:flex; align-items:flex-end; z-index:50;
  }
  #modal-box{
    background:var(--bg-elevated); border-top:1px solid var(--line);
    border-radius:20px 20px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    width:100%; max-height:82vh; overflow-y:auto;
  }
  #modal-title{
    font-family:var(--font-display); font-size:17px; font-weight:600; margin-bottom:16px;
  }
  #modal-body{ display:flex; flex-direction:column; gap:10px; }
  #modal-body label{ font-size:12px; color:var(--text-dim); margin-bottom:-4px; }
  #modal-body input, #modal-body select{
    background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:12px 14px; border-radius:10px; font-size:15px; font-family:var(--font-body);
    width:100%;
  }
  #modal-body input:focus, #modal-body select:focus{ outline:none; border-color:var(--accent); }
  #modal-actions{ display:flex; gap:10px; margin-top:18px; }
  #modal-actions button{ flex:1; }
  .btn-secondary{
    background:none; border:1px solid var(--line); color:var(--text-dim);
    padding:14px; border-radius:10px; font-size:15px; font-family:var(--font-body);
    cursor:pointer;
  }
</style>
</head>
<body>
<div id="app">

  <!-- LOGIN -->
  <div id="login-screen">
    <svg class="brand-pulse" viewBox="0 0 64 64" fill="none">
      <path d="M4 32H20L26 12L36 52L42 32H60" stroke="#3DDC97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div style="text-align:center;">
      <div class="brand-title">Prépa</div>
      <div class="brand-sub">Suivi de performance</div>
    </div>
    <div class="login-form">
      <input type="email" id="login-email" placeholder="Email" autocomplete="username" autocapitalize="none">
      <input type="password" id="login-password" placeholder="Mot de passe" autocomplete="current-password">
      <button class="btn-primary" id="login-btn">Se connecter</button>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="main-app" class="hidden" style="display:flex; flex-direction:column; height:100%;">
    <div id="main-header">
      <div>
        <h1 id="header-title">Accueil</h1>
        <div class="cat-label" id="header-cat">—</div>
      </div>
    </div>

    <div id="content">
      <div id="view-accueil"></div>
      <div id="view-calendrier" class="hidden section-empty">Module Calendrier — à construire ensuite.</div>
      <div id="view-joueurs" class="hidden"></div>
      <div id="view-charge" class="hidden section-empty">Module Charge — à construire ensuite.</div>
      <div id="view-plus" class="hidden"></div>
    </div>

    <div id="bottom-nav"></div>
  </div>

</div>

<!-- MODAL GÉNÉRIQUE -->
<div id="modal-overlay" class="hidden">
  <div id="modal-box">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div id="modal-actions">
      <button id="modal-cancel" class="btn-secondary">Annuler</button>
      <button id="modal-confirm" class="btn-primary" style="margin-top:0;">Valider</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// CONFIGURATION SUPABASE
// ============================================================
const SUPABASE_URL = "https://tzazamcdwdmxizxwxxbl.supabase.co";
const SUPABASE_KEY = "sb_publishable_9t_LM0dT7dFQrh6v0ndQ_g_Y-OOhE4W";

let sb;
try{
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: false
    }
  });
} catch(e){
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('login-error').textContent = 'La librairie Supabase n\'a pas pu se charger : ' + e.message;
  });
}

let currentProfile = null; // { id, role, club_id, player_id }

// ============================================================
// NAVIGATION CONFIG PAR RÔLE
// ============================================================
const ICONS = {
  accueil: '<svg viewBox="0 0 24 24"><path d="M3 11L12 3L21 11" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10V20H19V10" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  calendrier: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3V7M16 3V7M3 10H21" stroke-linecap="round"/></svg>',
  joueurs: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20C3 16 5.5 14 9 14C12.5 14 15 16 15 20" stroke-linecap="round"/><circle cx="17" cy="9" r="2.6"/><path d="M15 14C18 14 21 15.6 21 19" stroke-linecap="round"/></svg>',
  charge: '<svg viewBox="0 0 24 24"><path d="M4 19V13M10 19V6M16 19V10M22 19V3" stroke-linecap="round"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8V16M8 12H16" stroke-linecap="round"/></svg>',
  wellness: '<svg viewBox="0 0 24 24"><path d="M20 8.5C20 13 12 20 12 20C12 20 4 13 4 8.5C4 5.5 6.2 4 8.5 4C10 4 11.3 4.8 12 6C12.7 4.8 14 4 15.5 4C17.8 4 20 5.5 20 8.5Z" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

const NAV_BY_ROLE = {
  admin: [
    { key:'accueil', label:'Accueil' },
    { key:'calendrier', label:'Calendrier' },
    { key:'joueurs', label:'Joueurs' },
    { key:'charge', label:'Charge' },
    { key:'plus', label:'Plus' }
  ],
  coach: [
    { key:'accueil', label:'Accueil' },
    { key:'calendrier', label:'Calendrier' },
    { key:'joueurs', label:'Joueurs' },
    { key:'plus', label:'Plus' }
  ],
  joueur: [
    { key:'accueil', label:'Accueil' },
    { key:'wellness', label:'Questionnaire' },
    { key:'plus', label:'Mes résultats' }
  ]
};

// ============================================================
// AUTH
// ============================================================
document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('login-password').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Renseigne email et mot de passe.'; return; }

  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ errEl.textContent = error.message; return; }
    await loadProfileAndBoot();
  } catch(e){
    errEl.textContent = 'Erreur technique : ' + (e && e.message ? e.message : String(e));
    console.error(e);
  }
}

async function checkExistingSession(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await loadProfileAndBoot(); }
}

async function loadProfileAndBoot(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user) return;

  const { data:profile, error } = await sb
    .from('profils_utilisateurs')
    .select('id, role, club_id, player_id')
    .eq('id', user.id)
    .single();

  if(error || !profile){
    document.getElementById('login-error').textContent = "Compte sans profil configuré. Contacte l'admin.";
    await sb.auth.signOut();
    return;
  }

  currentProfile = profile;
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('main-app').classList.remove('hidden');
  await loadCategories();
  buildNav();
  showView('accueil');
}

// ============================================================
// NAVIGATION
// ============================================================
function buildNav(){
  const nav = NAV_BY_ROLE[currentProfile.role] || NAV_BY_ROLE.joueur;
  const bar = document.getElementById('bottom-nav');
  bar.innerHTML = '';
  nav.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn' + (i === 0 ? ' active' : '');
    btn.dataset.key = item.key;
    btn.innerHTML = ICONS[item.key] + '<span>' + item.label + '</span>';
    btn.addEventListener('click', () => showView(item.key));
    bar.appendChild(btn);
  });
}

function showView(key){
  document.querySelectorAll('#content > div').forEach(d => d.classList.add('hidden'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  const viewMap = { accueil:'view-accueil', calendrier:'view-calendrier', joueurs:'view-joueurs', charge:'view-charge', plus:'view-plus', wellness:'view-accueil' };
  const target = document.getElementById(viewMap[key] || 'view-accueil');
  target.classList.remove('hidden');
  document.getElementById('header-title').textContent = (NAV_BY_ROLE[currentProfile.role].find(n=>n.key===key)||{}).label || 'Accueil';
  if(key === 'accueil') renderAccueil();
  if(key === 'joueurs') renderJoueurs();
  if(key === 'plus') renderPlus();

  const fabEl = document.getElementById('global-fab');
  if(fabEl) fabEl.classList.toggle('hidden', !(key === 'joueurs' && currentProfile.role === 'admin'));
}

// ============================================================
// VUE ACCUEIL — badges wellness du jour
// ============================================================
async function renderAccueil(){
  const el = document.getElementById('view-accueil');
  el.innerHTML = '<div class="section-empty">Chargement…</div>';

  if(currentProfile.role === 'joueur'){
    el.innerHTML = '<div class="section-empty">Bienvenue. Le module questionnaire quotidien se construit à l\'étape suivante.</div>';
    return;
  }

  // Admin et coach : liste des joueurs avec badge du jour
  // (le coach passe par vue_alertes_coach, l'admin peut lire les tables brutes —
  //  ici on utilise la vue pour les deux, elle suffit pour l'affichage d'accueil)
  const { data:players, error } = await sb
    .from('players')
    .select('id, nom, prenom, categorie_id')
    .eq('actif', true);

  if(error){
    el.innerHTML = '<div class="section-empty">Erreur de chargement. Vérifie la connexion Supabase.</div>';
    console.error(error);
    return;
  }

  if(!players || players.length === 0){
    el.innerHTML = '<div class="section-empty">Aucun joueur enregistré pour le moment.<br>Ajoute des joueurs depuis le module Joueurs.</div>';
    return;
  }

  const { data:alertes } = await sb.from('vue_alertes_coach').select('*');
  const alertesMap = {};
  (alertes || []).forEach(a => alertesMap[a.player_id] = a);

  const counts = { rouge:0, orange:0, vert:0, gris:0 };
  const rows = players.map(p => {
    const a = alertesMap[p.id];
    const badge = a ? (a.badge_wellness || 'gris') : 'gris';
    counts[badge] = (counts[badge]||0) + 1;
    return { p, badge };
  }).sort((a,b) => {
    const order = { rouge:0, orange:1, gris:2, vert:3 };
    return order[a.badge] - order[b.badge];
  });

  let html = '<div class="summary-strip">';
  html += `<div class="summary-chip rouge"><div class="n">${counts.rouge}</div><div class="l">Rouge</div></div>`;
  html += `<div class="summary-chip orange"><div class="n">${counts.orange}</div><div class="l">Orange</div></div>`;
  html += `<div class="summary-chip gris"><div class="n">${counts.gris}</div><div class="l">Pas rempli</div></div>`;
  html += '</div>';

  rows.forEach(({p, badge}) => {
    html += `<div class="player-row">
      <div class="badge-dot ${badge}"></div>
      <div class="player-name">${p.prenom} ${p.nom}</div>
    </div>`;
  });

  el.innerHTML = html;
}

// ============================================================
// STATE GLOBAL — club / catégorie actifs
// ============================================================
let currentCategorieId = localStorage.getItem('active_categorie_id') || null;
let allCategories = []; // cache {id, nom, club_id, club_nom}

function setActiveCategorie(id){
  currentCategorieId = id;
  localStorage.setItem('active_categorie_id', id);
  document.getElementById('header-cat').textContent =
    (allCategories.find(c => c.id === id) || {}).label || '—';
}

async function loadCategories(){
  const { data:cats } = await sb.from('categories').select('id, nom, club_id, clubs(nom)').eq('actif', true);
  allCategories = (cats || []).map(c => ({
    id: c.id, nom: c.nom, club_id: c.club_id,
    label: `${c.nom} · ${c.clubs ? c.clubs.nom : ''}`
  }));
  if(!currentCategorieId && allCategories.length){
    setActiveCategorie(allCategories[0].id);
  } else if(currentCategorieId){
    setActiveCategorie(currentCategorieId);
  }
}

// ============================================================
// MODAL GÉNÉRIQUE
// ============================================================
function openModal({title, fields, onConfirm}){
  document.getElementById('modal-title').textContent = title;
  const body = document.getElementById('modal-body');
  body.innerHTML = '';
  fields.forEach(f => {
    const label = document.createElement('label');
    label.textContent = f.label;
    body.appendChild(label);
    let input;
    if(f.type === 'select'){
      input = document.createElement('select');
      (f.options||[]).forEach(o => {
        const opt = document.createElement('option');
        opt.value = o.value; opt.textContent = o.label;
        input.appendChild(opt);
      });
    } else {
      input = document.createElement('input');
      input.type = f.type || 'text';
      if(f.value) input.value = f.value;
    }
    input.id = 'modal-field-' + f.key;
    if(f.value !== undefined && f.type === 'select') input.value = f.value;
    body.appendChild(input);
  });
  document.getElementById('modal-overlay').classList.remove('hidden');

  const confirmBtn = document.getElementById('modal-confirm');
  const cancelBtn = document.getElementById('modal-cancel');
  const closeModal = () => document.getElementById('modal-overlay').classList.add('hidden');

  const newConfirm = confirmBtn.cloneNode(true);
  confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
  newConfirm.addEventListener('click', async () => {
    const values = {};
    fields.forEach(f => values[f.key] = document.getElementById('modal-field-' + f.key).value);
    await onConfirm(values);
    closeModal();
  });

  const newCancel = cancelBtn.cloneNode(true);
  cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);
  newCancel.addEventListener('click', closeModal);
}

// ============================================================
// VUE PLUS — Clubs & catégories (admin uniquement pour la gestion)
// ============================================================
async function renderPlus(){
  const el = document.getElementById('view-plus');
  if(currentProfile.role !== 'admin'){
    el.innerHTML = '<div class="section-empty">Mes résultats — module à construire ensuite.</div>';
    return;
  }

  const { data:clubs } = await sb.from('clubs').select('id, nom, actif').order('created_at', {ascending:false});

  let html = '<div class="section-title">Clubs</div>';
  (clubs||[]).forEach(c => {
    html += `<div class="list-row">
      <div class="main">
        <div class="title">${c.nom}</div>
        <div class="sub">${c.actif ? 'Actif' : 'Inactif'}</div>
      </div>
    </div>`;
  });
  html += `<button class="btn-secondary" id="btn-add-club" style="width:100%;">+ Nouveau club</button>`;

  html += '<div class="section-title">Catégories</div>';
  allCategories.forEach(c => {
    html += `<div class="list-row">
      <div class="main">
        <div class="title">${c.nom}</div>
        <div class="sub">${c.label}</div>
      </div>
    </div>`;
  });
  html += `<button class="btn-secondary" id="btn-add-categorie" style="width:100%;">+ Nouvelle catégorie</button>`;

  html += '<div class="section-title">Compte</div>';
  html += `<button class="btn-secondary" id="btn-logout" style="width:100%; color:var(--rouge); border-color:var(--rouge);">Se déconnecter</button>`;

  el.innerHTML = html;

  document.getElementById('btn-add-club').addEventListener('click', () => {
    openModal({
      title: 'Nouveau club',
      fields: [{key:'nom', label:'Nom du club', type:'text'}],
      onConfirm: async (v) => {
        if(!v.nom.trim()) return;
        await sb.from('clubs').insert({ nom: v.nom.trim() });
        await renderPlus();
      }
    });
  });

  document.getElementById('btn-add-categorie').addEventListener('click', async () => {
    const { data:clubsList } = await sb.from('clubs').select('id, nom').eq('actif', true);
    if(!clubsList || clubsList.length === 0){
      alert('Crée d\'abord un club.');
      return;
    }
    openModal({
      title: 'Nouvelle catégorie',
      fields: [
        {key:'club_id', label:'Club', type:'select', options: clubsList.map(c=>({value:c.id, label:c.nom}))},
        {key:'nom', label:'Nom (ex: U15)', type:'text'},
        {key:'saison', label:'Saison (ex: 2026-2027)', type:'text'}
      ],
      onConfirm: async (v) => {
        if(!v.nom.trim() || !v.saison.trim()) return;
        await sb.from('categories').insert({ club_id: v.club_id, nom: v.nom.trim(), saison: v.saison.trim() });
        await loadCategories();
        await renderPlus();
      }
    });
  });

  document.getElementById('btn-logout').addEventListener('click', async () => {
    await sb.auth.signOut();
    location.reload();
  });
}

// ============================================================
// VUE JOUEURS
// ============================================================
async function renderJoueurs(){
  const el = document.getElementById('view-joueurs');

  if(allCategories.length === 0){
    el.innerHTML = '<div class="section-empty">Aucune catégorie créée.<br>Va dans <strong>Plus</strong> pour créer ton club et ta catégorie.</div>';
    return;
  }

  let selectorHtml = '<div class="selector-bar">';
  allCategories.forEach(c => {
    selectorHtml += `<div class="selector-chip ${c.id===currentCategorieId?'active':''}" data-cat="${c.id}">${c.label}</div>`;
  });
  selectorHtml += '</div>';

  const { data:players, error } = await sb
    .from('players')
    .select('*')
    .eq('categorie_id', currentCategorieId)
    .eq('actif', true)
    .order('nom');

  let listHtml = '';
  if(error){
    listHtml = '<div class="section-empty">Erreur de chargement.</div>';
  } else if(!players || players.length === 0){
    listHtml = '<div class="section-empty">Aucun joueur dans cette catégorie.<br>Ajoute-en avec le bouton +.</div>';
  } else {
    players.forEach(p => {
      const age = p.date_naissance ? Math.floor((Date.now() - new Date(p.date_naissance)) / 31557600000) : '?';
      listHtml += `<div class="list-row">
        <div class="main">
          <div class="title">${p.prenom} ${p.nom}</div>
          <div class="sub">${age} ans${p.poste ? ' · ' + p.poste : ''}</div>
        </div>
        <button class="icon-btn danger" data-del="${p.id}">
          <svg viewBox="0 0 24 24"><path d="M4 7H20M9 7V4H15V7M6 7L7 20H17L18 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>`;
    });
  }

  el.innerHTML = selectorHtml + listHtml;

  el.querySelectorAll('.selector-chip').forEach(chip => {
    chip.addEventListener('click', () => { setActiveCategorie(chip.dataset.cat); renderJoueurs(); });
  });
  el.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('Retirer ce joueur du roster actif ?')) return;
      await sb.from('players').update({actif:false}).eq('id', btn.dataset.del);
      renderJoueurs();
    });
  });
}

function openAddPlayerModal(){
  openModal({
    title: 'Nouveau joueur',
    fields: [
      {key:'prenom', label:'Prénom', type:'text'},
      {key:'nom', label:'Nom', type:'text'},
      {key:'date_naissance', label:'Date de naissance', type:'date'},
      {key:'poste', label:'Poste', type:'select', options:[
        {value:'gardien', label:'Gardien'},
        {value:'defenseur', label:'Défenseur'},
        {value:'milieu', label:'Milieu'},
        {value:'attaquant', label:'Attaquant'}
      ]},
      {key:'pied_fort', label:'Pied fort', type:'select', options:[
        {value:'droit', label:'Droit'},
        {value:'gauche', label:'Gauche'},
        {value:'ambidextre', label:'Ambidextre'}
      ]}
    ],
    onConfirm: async (v) => {
      if(!v.prenom.trim() || !v.nom.trim() || !v.date_naissance) return;
      const cat = allCategories.find(c => c.id === currentCategorieId);
      await sb.from('players').insert({
        club_id: cat.club_id,
        categorie_id: currentCategorieId,
        prenom: v.prenom.trim(),
        nom: v.nom.trim(),
        date_naissance: v.date_naissance,
        poste: v.poste,
        pied_fort: v.pied_fort
      });
      renderJoueurs();
    }
  });
}

// FAB flottant, affiché uniquement sur la vue Joueurs pour l'admin
const fab = document.createElement('button');
fab.className = 'fab hidden';
fab.id = 'global-fab';
fab.textContent = '+';
fab.addEventListener('click', () => {
  if(document.getElementById('view-joueurs').classList.contains('hidden')) return;
  if(!currentCategorieId){ alert('Crée d\'abord une catégorie depuis Plus.'); return; }
  openAddPlayerModal();
});
document.body.appendChild(fab);

checkExistingSession();

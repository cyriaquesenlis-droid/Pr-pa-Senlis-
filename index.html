<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0F14">
<link rel="manifest" href="manifest.json">
<title>Prépa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#0B0F14;
    --bg-elevated:#11161D;
    --line:#1E2530;
    --text:#E7ECF2;
    --text-dim:#8A94A3;
    --accent:#3DDC97;
    --accent-dim:#1F7A56;
    --rouge:#FF5D5D;
    --orange:#FFA53D;
    --vert:#3DDC97;
    --gris:#3A4250;
    --font-display:'Space Grotesk', system-ui, sans-serif;
    --font-body:-apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    --font-data:'JetBrains Mono', 'SF Mono', monospace;
  }
  @font-face{
    font-family:'Space Grotesk';
    src:local('Space Grotesk');
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:var(--font-body);
    overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
  }
  input{ -webkit-user-select:text; user-select:text; }
  #app{ display:flex; flex-direction:column; height:100vh; height:100dvh; }

  /* ---------- LOGIN ---------- */
  #login-screen{
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    height:100%; padding:32px; gap:28px;
  }
  .brand-pulse{
    width:64px; height:64px;
  }
  .brand-title{
    font-family:var(--font-display); font-weight:700; font-size:28px;
    letter-spacing:-0.02em; color:var(--text);
  }
  .brand-sub{
    font-size:13px; color:var(--text-dim); letter-spacing:0.08em; text-transform:uppercase;
    margin-top:-16px;
  }
  .login-form{ width:100%; max-width:340px; display:flex; flex-direction:column; gap:12px; }
  .login-form input{
    background:var(--bg-elevated); border:1px solid var(--line); color:var(--text);
    padding:14px 16px; border-radius:10px; font-size:16px; font-family:var(--font-body);
  }
  .login-form input:focus{ outline:none; border-color:var(--accent); }
  .btn-primary{
    background:var(--accent); color:#04140D; border:none; padding:14px;
    border-radius:10px; font-size:15px; font-weight:600; font-family:var(--font-body);
    cursor:pointer; margin-top:4px;
  }
  .btn-primary:active{ opacity:0.85; }
  .login-error{ color:var(--rouge); font-size:13px; text-align:center; min-height:16px; }

  /* ---------- HEADER ---------- */
  #main-header{
    padding:18px 20px 14px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
    flex-shrink:0;
  }
  #main-header h1{
    font-family:var(--font-display); font-size:19px; font-weight:600; margin:0;
    letter-spacing:-0.01em;
  }
  #main-header .cat-label{
    font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em;
  }

  /* ---------- CONTENT ---------- */
  #content{ flex:1; overflow-y:auto; padding:16px 16px 90px; -webkit-overflow-scrolling:touch; }

  .section-empty{
    text-align:center; color:var(--text-dim); padding:60px 24px; font-size:14px; line-height:1.6;
  }

  /* player row */
  .player-row{
    display:flex; align-items:center; gap:12px;
    background:var(--bg-elevated); border:1px solid var(--line);
    border-radius:12px; padding:14px 16px; margin-bottom:8px;
  }
  .badge-dot{
    width:11px; height:11px; border-radius:50%; flex-shrink:0;
  }
  .badge-dot.rouge{ background:var(--rouge); box-shadow:0 0 8px rgba(255,93,93,0.5); }
  .badge-dot.orange{ background:var(--orange); box-shadow:0 0 8px rgba(255,165,61,0.5); }
  .badge-dot.vert{ background:var(--vert); box-shadow:0 0 8px rgba(61,220,151,0.4); }
  .badge-dot.gris{ background:var(--gris); }
  .player-name{ flex:1; font-size:15px; font-weight:500; }
  .player-meta{ font-size:12px; color:var(--text-dim); font-family:var(--font-data); }

  .summary-strip{
    display:flex; gap:8px; margin-bottom:18px; overflow-x:auto;
  }
  .summary-chip{
    background:var(--bg-elevated); border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; min-width:78px; flex-shrink:0;
  }
  .summary-chip .n{ font-family:var(--font-data); font-size:20px; font-weight:600; }
  .summary-chip .l{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px; }
  .summary-chip.rouge .n{ color:var(--rouge); }
  .summary-chip.orange .n{ color:var(--orange); }
  .summary-chip.gris .n{ color:var(--text-dim); }

  /* ---------- BOTTOM NAV ---------- */
  #bottom-nav{
    position:fixed; bottom:0; left:0; right:0;
    background:rgba(11,15,20,0.92); backdrop-filter:blur(20px);
    border-top:1px solid var(--line);
    display:flex; padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; color:var(--text-dim); padding:6px 2px;
    font-family:var(--font-body); font-size:10.5px; cursor:pointer;
  }
  .nav-btn svg{ width:22px; height:22px; stroke:var(--text-dim); fill:none; stroke-width:1.8; }
  .nav-btn.active{ color:var(--accent); }
  .nav-btn.active svg{ stroke:var(--accent); }

  .hidden{ display:none !important; }

  /* ---------- LISTES / SECTIONS GÉNÉRIQUES ---------- */
  .section-title{
    font-family:var(--font-display); font-size:13px; font-weight:600;
    text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim);
    margin:20px 0 10px;
  }
  .section-title:first-child{ margin-top:0; }
  .list-row{
    display:flex; align-items:center; gap:12px;
    background:var(--bg-elevated); border:1px solid var(--line);
    border-radius:12px; padding:14px 16px; margin-bottom:8px;
  }
  .list-row .main{ flex:1; }
  .list-row .title{ font-size:15px; font-weight:500; }
  .list-row .sub{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .icon-btn{
    background:none; border:none; color:var(--text-dim); padding:6px;
    cursor:pointer;
  }
  .icon-btn svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; }
  .icon-btn.danger{ color:var(--rouge); }

  .fab{
    position:fixed; bottom:96px; right:20px;
    width:52px; height:52px; border-radius:50%;
    background:var(--accent); border:none; color:#04140D;
    font-size:26px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 16px rgba(61,220,151,0.35);
    cursor:pointer; z-index:5;
  }

  .selector-bar{
    display:flex; gap:8px; margin-bottom:16px; overflow-x:auto;
  }
  .selector-chip{
    background:var(--bg-elevated); border:1px solid var(--line); color:var(--text-dim);
    padding:8px 14px; border-radius:20px; font-size:13px; white-space:nowrap;
    cursor:pointer; flex-shrink:0;
  }
  .selector-chip.active{ background:var(--accent-dim); color:var(--accent); border-color:var(--accent); }

  /* ---------- MODAL ---------- */
  #modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    display:flex; align-items:flex-end; z-index:50;
  }
  #modal-box{
    background:var(--bg-elevated); border-top:1px solid var(--line);
    border-radius:20px 20px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    width:100%; max-height:82vh; overflow-y:auto;
  }
  #modal-title{
    font-family:var(--font-display); font-size:17px; font-weight:600; margin-bottom:16px;
  }
  #modal-body{ display:flex; flex-direction:column; gap:10px; }
  #modal-body label{ font-size:12px; color:var(--text-dim); margin-bottom:-4px; }
  #modal-body input, #modal-body select{
    background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:12px 14px; border-radius:10px; font-size:15px; font-family:var(--font-body);
    width:100%;
  }
  #modal-body input:focus, #modal-body select:focus{ outline:none; border-color:var(--accent); }
  #modal-actions{ display:flex; gap:10px; margin-top:18px; }
  #modal-actions button{ flex:1; }
  .btn-secondary{
    background:none; border:1px solid var(--line); color:var(--text-dim);
    padding:14px; border-radius:10px; font-size:15px; font-family:var(--font-body);
    cursor:pointer;
  }

  /* ---------- FICHE JOUEUR ---------- */
  .fiche-back{
    display:flex; align-items:center; gap:8px; color:var(--accent);
    font-size:14px; margin-bottom:14px; cursor:pointer; background:none; border:none;
    font-family:var(--font-body); padding:4px 0;
  }
  .fiche-back svg{ width:18px; height:18px; stroke:var(--accent); fill:none; stroke-width:2; }
  .fiche-header{ margin-bottom:18px; }
  .fiche-header .name{ font-family:var(--font-display); font-size:22px; font-weight:600; }
  .fiche-header .meta{ font-size:13px; color:var(--text-dim); margin-top:2px; }

  .test-type-block{
    background:var(--bg-elevated); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:12px;
  }
  .test-type-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .test-type-header .label{ font-size:14px; font-weight:600; }
  .test-type-header .latest{
    font-family:var(--font-data); font-size:18px; color:var(--accent); font-weight:600;
  }
  .test-canvas{ width:100%; height:70px; display:block; }
  .test-entries{ margin-top:10px; }
  .test-entry-row{
    display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-dim);
    padding:5px 0; border-top:1px solid var(--line);
  }
  .test-entry-row span:last-child{ font-family:var(--font-data); color:var(--text); }

  /* ---------- BLESSURES / RTP ---------- */
  .injury-active{
    background:rgba(255,93,93,0.08); border:1px solid rgba(255,93,93,0.3);
    border-radius:12px; padding:14px; margin-bottom:12px;
  }
  .injury-active .type{ font-size:15px; font-weight:600; color:var(--rouge); }
  .injury-phase-badge{
    display:inline-block; background:var(--rouge); color:#fff; font-size:11px;
    padding:3px 10px; border-radius:20px; margin-top:6px; text-transform:capitalize;
  }
  .injury-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-top:1px solid var(--line); font-size:13px;
  }
  .injury-row .l{ color:var(--text); }
  .injury-row .r{ color:var(--text-dim); font-size:12px; }
  .fiche-actions{ display:flex; gap:8px; margin-bottom:16px; }
  .fiche-actions button{ flex:1; }

  /* ---------- CALENDRIER ---------- */
  .event-row{
    display:flex; align-items:center; gap:12px;
    background:var(--bg-elevated); border:1px solid var(--line);
    border-radius:12px; padding:12px 16px; margin-bottom:8px; cursor:pointer;
  }
  .event-date-block{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:44px; flex-shrink:0;
  }
  .event-date-block .d{ font-family:var(--font-data); font-size:18px; font-weight:600; }
  .event-date-block .m{ font-size:10px; color:var(--text-dim); text-transform:uppercase; }
  .event-main{ flex:1; }
  .event-type-tag{
    display:inline-block; font-size:10.5px; padding:2px 8px; border-radius:10px;
    text-transform:uppercase; letter-spacing:0.03em; margin-bottom:3px;
  }
  .event-type-tag.entrainement{ background:rgba(61,220,151,0.15); color:var(--vert); }
  .event-type-tag.match{ background:rgba(255,165,61,0.15); color:var(--orange); }
  .event-type-tag.repos{ background:var(--gris); color:var(--text-dim); }
  .event-title{ font-size:14px; font-weight:500; }
  .event-time{ font-size:12px; color:var(--text-dim); }

  .rpe-grid-row{
    display:flex; align-items:center; gap:10px;
    padding:10px 0; border-top:1px solid var(--line);
  }
  .rpe-grid-row .name{ flex:1; font-size:14px; }
  .rpe-grid-row select, .rpe-grid-row input{
    background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:8px 10px; border-radius:8px; font-size:14px; width:64px; font-family:var(--font-data);
  }

  .event-preview{ font-size:11.5px; color:var(--text-dim); margin-top:4px; line-height:1.4; }
  .event-preview b{ color:var(--text); font-weight:500; }

  .view-toggle{ display:flex; gap:6px; margin-bottom:14px; }
  .view-toggle button{
    flex:1; background:var(--bg-elevated); border:1px solid var(--line); color:var(--text-dim);
    padding:9px; border-radius:9px; font-size:13px; cursor:pointer; font-family:var(--font-body);
  }
  .view-toggle button.active{ background:var(--accent-dim); color:var(--accent); border-color:var(--accent); }

  .month-nav{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .month-nav .label{ font-family:var(--font-display); font-size:15px; font-weight:600; text-transform:capitalize; }
  .month-nav button{ background:none; border:none; color:var(--accent); font-size:20px; padding:4px 10px; }
  .month-grid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:3px; margin-bottom:16px; }
  .month-grid .dow{ font-size:10px; color:var(--text-dim); text-align:center; padding-bottom:4px; }
  .month-cell{
    aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:8px; font-size:12px; color:var(--text-dim); position:relative; cursor:pointer;
  }
  .month-cell.empty{ cursor:default; }
  .month-cell.today{ border:1px solid var(--accent); }
  .month-cell.selected{ background:var(--bg-elevated); }
  .month-cell .dots{ display:flex; gap:2px; position:absolute; bottom:5px; }
  .month-cell .dot{ width:4px; height:4px; border-radius:50%; }
  .dot.entrainement{ background:var(--vert); }
  .dot.match{ background:var(--orange); }
  .dot.repos{ background:var(--gris); }
</style>
</head>
<body>
<div id="app">

  <!-- LOGIN -->
  <div id="login-screen">
    <svg class="brand-pulse" viewBox="0 0 64 64" fill="none">
      <path d="M4 32H20L26 12L36 52L42 32H60" stroke="#3DDC97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div style="text-align:center;">
      <div class="brand-title">Prépa</div>
      <div class="brand-sub">Suivi de performance</div>
    </div>
    <div class="login-form">
      <input type="email" id="login-email" placeholder="Email" autocomplete="username" autocapitalize="none">
      <input type="password" id="login-password" placeholder="Mot de passe" autocomplete="current-password">
      <button class="btn-primary" id="login-btn">Se connecter</button>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="main-app" class="hidden" style="display:flex; flex-direction:column; height:100%;">
    <div id="main-header">
      <div>
        <h1 id="header-title">Accueil</h1>
        <div class="cat-label" id="header-cat">—</div>
      </div>
    </div>

    <div id="content">
      <div id="view-accueil"></div>
      <div id="view-calendrier" class="hidden"></div>
      <div id="view-evenement" class="hidden"></div>
      <div id="view-joueurs" class="hidden"></div>
      <div id="view-fiche-joueur" class="hidden"></div>
      <div id="view-charge" class="hidden section-empty">Module Charge — à construire ensuite.</div>
      <div id="view-plus" class="hidden"></div>
    </div>

    <div id="bottom-nav"></div>
  </div>

</div>

<!-- MODAL GÉNÉRIQUE -->
<div id="modal-overlay" class="hidden">
  <div id="modal-box">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div id="modal-actions">
      <button id="modal-cancel" class="btn-secondary">Annuler</button>
      <button id="modal-confirm" class="btn-primary" style="margin-top:0;">Valider</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// CONFIGURATION SUPABASE
// ============================================================
const SUPABASE_URL = "https://tzazamcdwdmxizxwxxbl.supabase.co";
const SUPABASE_KEY = "sb_publishable_9t_LM0dT7dFQrh6v0ndQ_g_Y-OOhE4W";

let sb;
try{
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: false
    }
  });
} catch(e){
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('login-error').textContent = 'La librairie Supabase n\'a pas pu se charger : ' + e.message;
  });
}

let currentProfile = null; // { id, role, club_id, player_id }

// ============================================================
// NAVIGATION CONFIG PAR RÔLE
// ============================================================
const ICONS = {
  accueil: '<svg viewBox="0 0 24 24"><path d="M3 11L12 3L21 11" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10V20H19V10" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  calendrier: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3V7M16 3V7M3 10H21" stroke-linecap="round"/></svg>',
  joueurs: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20C3 16 5.5 14 9 14C12.5 14 15 16 15 20" stroke-linecap="round"/><circle cx="17" cy="9" r="2.6"/><path d="M15 14C18 14 21 15.6 21 19" stroke-linecap="round"/></svg>',
  charge: '<svg viewBox="0 0 24 24"><path d="M4 19V13M10 19V6M16 19V10M22 19V3" stroke-linecap="round"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8V16M8 12H16" stroke-linecap="round"/></svg>',
  wellness: '<svg viewBox="0 0 24 24"><path d="M20 8.5C20 13 12 20 12 20C12 20 4 13 4 8.5C4 5.5 6.2 4 8.5 4C10 4 11.3 4.8 12 6C12.7 4.8 14 4 15.5 4C17.8 4 20 5.5 20 8.5Z" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

const NAV_BY_ROLE = {
  admin: [
    { key:'accueil', label:'Accueil' },
    { key:'calendrier', label:'Calendrier' },
    { key:'joueurs', label:'Joueurs' },
    { key:'charge', label:'Charge' },
    { key:'plus', label:'Plus' }
  ],
  coach: [
    { key:'accueil', label:'Accueil' },
    { key:'calendrier', label:'Calendrier' },
    { key:'joueurs', label:'Joueurs' },
    { key:'plus', label:'Plus' }
  ],
  joueur: [
    { key:'accueil', label:'Accueil' },
    { key:'wellness', label:'Questionnaire' },
    { key:'plus', label:'Mes résultats' }
  ]
};

// ============================================================
// AUTH
// ============================================================
document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('login-password').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Renseigne email et mot de passe.'; return; }

  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ errEl.textContent = error.message; return; }
    await loadProfileAndBoot();
  } catch(e){
    errEl.textContent = 'Erreur technique : ' + (e && e.message ? e.message : String(e));
    console.error(e);
  }
}

async function checkExistingSession(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await loadProfileAndBoot(); }
}

async function loadProfileAndBoot(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user) return;

  const { data:profile, error } = await sb
    .from('profils_utilisateurs')
    .select('id, role, club_id, player_id')
    .eq('id', user.id)
    .single();

  if(error || !profile){
    document.getElementById('login-error').textContent = "Compte sans profil configuré. Contacte l'admin.";
    await sb.auth.signOut();
    return;
  }

  currentProfile = profile;
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('main-app').classList.remove('hidden');
  await loadCategories();
  buildNav();
  showView('accueil');
}

// ============================================================
// NAVIGATION
// ============================================================
function buildNav(){
  const nav = NAV_BY_ROLE[currentProfile.role] || NAV_BY_ROLE.joueur;
  const bar = document.getElementById('bottom-nav');
  bar.innerHTML = '';
  nav.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn' + (i === 0 ? ' active' : '');
    btn.dataset.key = item.key;
    btn.innerHTML = ICONS[item.key] + '<span>' + item.label + '</span>';
    btn.addEventListener('click', () => showView(item.key));
    bar.appendChild(btn);
  });
}

function showView(key){
  document.querySelectorAll('#content > div').forEach(d => d.classList.add('hidden'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));

async function renderAccueil(){
  const el = document.getElementById('view-accueil');
  el.innerHTML = '<div class="section-empty">Chargement…</div>';

  if(currentProfile.role === 'joueur'){
    el.innerHTML = '<div class="section-empty">Bienvenue. Le module questionnaire quotidien se construit à l\'étape suivante.</div>';
    return;
  }

  // Admin et coach : liste des joueurs avec badge du jour
  // (le coach passe par vue_alertes_coach, l'admin peut lire les tables brutes —
  //  ici on utilise la vue pour les deux, elle suffit pour l'affichage d'accueil)
  const { data:players, error } = await sb
    .from('players')
    .select('id, nom, prenom, categorie_id')
    .eq('actif', true);

  if(error){
    el.innerHTML = '<div class="section-empty">Erreur de chargement. Vérifie la connexion Supabase.</div>';
    console.error(error);
    return;
  }

  if(!players || players.length === 0){
    el.innerHTML = '<div class="section-empty">Aucun joueur enregistré pour le moment.<br>Ajoute des joueurs depuis le module Joueurs.</div>';
    return;
  }

  const { data:alertes } = await sb.from('vue_alertes_coach').select('*');
  const alertesMap = {};
  (alertes || []).forEach(a => alertesMap[a.player_id] = a);

  const counts = { rouge:0, orange:0, vert:0, gris:0 };
  const rows = players.map(p => {
    const a = alertesMap[p.id];
    const badge = a ? (a.badge_wellness || 'gris') : 'gris';
    counts[badge] = (counts[badge]||0) + 1;
    return { p, badge };
  }).sort((a,b) => {
    const order = { rouge:0, orange:1, gris:2, vert:3 };
    return order[a.badge] - order[b.badge];
  });

  let html = '<div class="summary-strip">';
  html += `<div class="summary-chip rouge"><div class="n">${counts.rouge}</div><div class="l">Rouge</div></div>`;
  html += `<div class="summary-chip orange"><div class="n">${counts.orange}</div><div class="l">Orange</div></div>`;
  html += `<div class="summary-chip gris"><div class="n">${counts.gris}</div><div class="l">Pas rempli</div></div>`;
  html += '</div>';

  rows.forEach(({p, badge}) => {
    html += `<div class="player-row">
      <div class="badge-dot ${badge}"></div>
      <div class="player-name">${p.prenom} ${p.nom}</div>
    </div>`;
  });

  el.innerHTML = html;
}

// ============================================================
// MODAL GÉNÉRIQUE
// ============================================================
function openModal({title, fields, onConfirm, onDelete}){
  document.getElementById('modal-title').textContent = title;
  const body = document.getElementById('modal-body');
  body.innerHTML = '';
  fields.forEach(f => {
    const label = document.createElement('label');
    label.textContent = f.label;
    body.appendChild(label);
    let input;
    if(f.type === 'select'){
      input = document.createElement('select');
      (f.options||[]).forEach(o => {
        const opt = document.createElement('option');
        opt.value = o.value; opt.textContent = o.label;
        input.appendChild(opt);
      });
    } else {
      input = document.createElement('input');
      input.type = f.type || 'text';
      if(f.value) input.value = f.value;
    }
    input.id = 'modal-field-' + f.key;
    if(f.value !== undefined && f.type === 'select') input.value = f.value;
    body.appendChild(input);
  });

  if(onDelete){
    const delBtn = document.createElement('button');
    delBtn.textContent = 'Supprimer';
    delBtn.className = 'btn-secondary';
    delBtn.style.cssText = 'width:100%; margin-top:10px; color:var(--rouge); border-color:var(--rouge);';
    delBtn.addEventListener('click', async () => {
      if(!confirm('Supprimer définitivement ?')) return;
      await onDelete();
      document.getElementById('modal-overlay').classList.add('hidden');
    });
    body.appendChild(delBtn);
  }

  document.getElementById('modal-overlay').classList.remove('hidden');

  const confirmBtn = document.getElementById('modal-confirm');
  const cancelBtn = document.getElementById('modal-cancel');
  const closeModal = () => document.getElementById('modal-overlay').classList.add('hidden');

  const newConfirm = confirmBtn.cloneNode(true);
  confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
  newConfirm.addEventListener('click', async () => {
    const values = {};
    fields.forEach(f => values[f.key] = document.getElementById('modal-field-' + f.key).value);
    await onConfirm(values);
    closeModal();
  });

  const newCancel = cancelBtn.cloneNode(true);
  cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);
  newCancel.addEventListener('click', closeModal);
}

    .from('players')
    .select('*')
    .eq('categorie_id', currentCategorieId)
    .eq('actif', true)
    .order('nom');

      listHtml += `<div class="list-row" data-open="${p.id}" style="cursor:pointer;">

        </button>
      </div>`;
    });

  el.innerHTML = selectorHtml + listHtml;

  el.querySelectorAll('.selector-chip').forEach(chip => {
    chip.addEventListener('click', () => { setActiveCategorie(chip.dataset.cat); renderJoueurs(); });
  });
  el.querySelectorAll('[data-open]').forEach(row => {
    row.addEventListener('click', (e) => {
      if(e.target.closest('[data-del]')) return;
      openFicheJoueur(row.dataset.open);

      await sb.from('players').update({actif:false}).eq('id', btn.dataset.del);
      renderJoueurs();
    });

const JOURS_SEMAINE = [
  {key:'lundi', idx:1}, {key:'mardi', idx:2}, {key:'mercredi', idx:3}, {key:'jeudi', idx:4},
  {key:'vendredi', idx:5}, {key:'samedi', idx:6}, {key:'dimanche', idx:0}
];
const MOIS_ABBR = ['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];

let calendrierVue = 'liste';
let moisAffiche = new Date();

async function renderCalendrier(){
  const el = document.getElementById('view-calendrier');

  if(!currentCategorieId){
    el.innerHTML = '<div class="section-empty">Crée d\'abord une catégorie depuis Plus.</div>';
    return;
  }

  const { data:events } = await sb
    .from('evenements')
    .select('*')
    .eq('categorie_id', currentCategorieId)
    .order('date', {ascending:true})
    .order('heure_debut', {ascending:true});

  // Aperçu contenu athlétique/technique pour tous les événements affichés
  const eventIds = (events||[]).map(e => e.id);
  const { data:contenus } = eventIds.length
    ? await sb.from('contenu_athletique').select('*').in('evenement_id', eventIds)
    : { data:[] };
  const { data:contenusTech } = eventIds.length
    ? await sb.from('contenu_technique').select('*').in('evenement_id', eventIds)
    : { data:[] };
  const contenuMap = {}; (contenus||[]).forEach(c => contenuMap[c.evenement_id] = c);
  const contenuTechMap = {}; (contenusTech||[]).forEach(c => contenuTechMap[c.evenement_id] = c);

  let html = `<button class="btn-secondary" id="btn-new-event" style="width:100%; margin-bottom:14px;">+ Nouvel événement</button>`;
  html += `<div class="view-toggle">
    <button data-vue="liste" class="${calendrierVue==='liste'?'active':''}">Liste</button>
    <button data-vue="mois" class="${calendrierVue==='mois'?'active':''}">Mois</button>
  </div>`;

  if(calendrierVue === 'mois'){
    html += renderMonthGrid(events||[]);
  } else {
    const today = new Date().toISOString().slice(0,10);
    const upcoming = (events||[]).filter(e => e.date >= today);
    const past = (events||[]).filter(e => e.date < today).reverse();

    html += '<div class="section-title">À venir</div>';
    html += upcoming.length ? upcoming.map(e => renderEventRow(e, contenuMap[e.id], contenuTechMap[e.id])).join('') : '<div class="section-empty" style="padding:20px;">Rien de planifié.</div>';

    html += '<div class="section-title">Passés</div>';
    html += past.length ? past.slice(0,15).map(e => renderEventRow(e, contenuMap[e.id], contenuTechMap[e.id])).join('') : '<div class="section-empty" style="padding:20px;">Aucun événement passé.</div>';
  }

  el.innerHTML = html;

  document.getElementById('btn-new-event').addEventListener('click', openNewEventModal);
  el.querySelectorAll('.view-toggle button').forEach(btn => {
    btn.addEventListener('click', () => { calendrierVue = btn.dataset.vue; renderCalendrier(); });
  });
  el.querySelectorAll('[data-open-event]').forEach(row => {
    row.addEventListener('click', () => openEventDetail(row.dataset.openEvent));
  });
  if(calendrierVue === 'mois') bindMonthNav(events||[]);
}

function renderEventRow(e, contenu, contenuTech){
  const d = new Date(e.date + 'T00:00:00');
  let preview = '';
  if(contenu && contenu.description){
    preview += `<div class="event-preview"><b>Athlé :</b> ${contenu.description}</div>`;
  }
  if(contenuTech && contenuTech.description){
    preview += `<div class="event-preview"><b>Coach :</b> ${contenuTech.description}</div>`;
  }
  return `<div class="event-row" data-open-event="${e.id}">
    <div class="event-date-block">
      <div class="d">${d.getDate()}</div>
      <div class="m">${MOIS_ABBR[d.getMonth()]}</div>
    </div>
    <div class="event-main">
      <div class="event-type-tag ${e.type}">${e.type}</div>
      <div class="event-title">${e.type === 'match' && e.adversaire ? 'vs ' + e.adversaire : (e.lieu || 'Sans lieu précisé')}</div>
      <div class="event-time">${e.heure_debut?.slice(0,5) || ''} - ${e.heure_fin?.slice(0,5) || ''}</div>
      ${preview}
    </div>
  </div>`;
}

// ---------- VUE MOIS ----------
function renderMonthGrid(events){
  const year = moisAffiche.getFullYear(), month = moisAffiche.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = (firstDay.getDay() + 6) % 7; // lundi = 0
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);

  const eventsByDay = {};
  events.forEach(e => {
    const ed = new Date(e.date + 'T00:00:00');
    if(ed.getFullYear() === year && ed.getMonth() === month){
      (eventsByDay[ed.getDate()] = eventsByDay[ed.getDate()] || []).push(e);
    }
  });

  let html = `<div class="month-nav">
    <button id="month-prev">‹</button>

  html += '</div>';
  html += `<div id="month-day-detail"></div>`;
  return html;
}

function calcDureeMin(hDebut, hFin){
  if(!hDebut || !hFin) return 60;
  const [h1,m1] = hDebut.split(':').map(Number);
  const [h2,m2] = hFin.split(':').map(Number);
  return (h2*60+m2) - (h1*60+m1);
}

// ============================================================
// ANTHROPOMÉTRIE & MATURATION
// ============================================================
function calcAgeDecimal(dateNaissance){
  const now = new Date();
  const dn = new Date(dateNaissance);
  const diffMs = now - dn;
  return diffMs / (365.25 * 24 * 3600 * 1000);
}

function calcMaturityOffset(p){
  if(!p.taille_cm || !p.taille_assise_cm || !p.poids_kg || !p.sexe || !p.date_naissance) return null;
  const age = calcAgeDecimal(p.date_naissance);
  const legLength = p.taille_cm - p.taille_assise_cm;
  const sittingHeight = p.taille_assise_cm;
  const weightHeightRatio = (p.poids_kg / p.taille_cm) * 100;

  let offset;
  if(p.sexe === 'garcon'){
    offset = -9.236
      + 0.0002708 * (legLength * sittingHeight)
      - 0.001663 * (age * legLength)
      + 0.007216 * (age * sittingHeight)
      + 0.02292 * weightHeightRatio;
  } else {
    offset = -9.376
      + 0.0001882 * (legLength * sittingHeight)
      + 0.0022 * (age * legLength)
      + 0.005841 * (age * sittingHeight)
      - 0.002658 * (age * p.poids_kg)
      + 0.07693 * weightHeightRatio;
  }
  return { offset, ageAuPHV: age - offset, ageActuel: age };
}

function renderAnthropoContent(p){
  const rows = [];
  const imc = (p.taille_cm && p.poids_kg) ? (p.poids_kg / Math.pow(p.taille_cm/100, 2)).toFixed(1) : null;

  rows.push(`<div class="test-entry-row"><span>Taille</span><span>${p.taille_cm ? p.taille_cm + ' cm' : '—'}</span></div>`);
  rows.push(`<div class="test-entry-row"><span>Taille assise</span><span>${p.taille_assise_cm ? p.taille_assise_cm + ' cm' : '—'}</span></div>`);
  rows.push(`<div class="test-entry-row"><span>Poids</span><span>${p.poids_kg ? p.poids_kg + ' kg' : '—'}</span></div>`);
  rows.push(`<div class="test-entry-row"><span>IMC</span><span>${imc || '—'}</span></div>`);

  const mat = calcMaturityOffset(p);
  if(mat){
    const statut = mat.offset < -0.5 ? 'pré-PHV' : (mat.offset > 0.5 ? 'post-PHV' : 'en PHV (pic actuel)');
    rows.push(`<div class="test-entry-row"><span>Âge estimé au PHV</span><span>${mat.ageAuPHV.toFixed(1)} ans</span></div>`);
    rows.push(`<div class="test-entry-row"><span>Statut de maturation</span><span>${statut}</span></div>`);
  } else {
    rows.push(`<div class="test-entry-row"><span>PHV (maturation)</span><span>taille assise/poids manquants</span></div>`);
  }

  if(p.taille_pere_cm && p.taille_mere_cm && p.sexe){
    const cible = p.sexe === 'garcon'
      ? (p.taille_pere_cm + p.taille_mere_cm + 13) / 2
      : (p.taille_pere_cm + p.taille_mere_cm - 13) / 2;
    rows.push(`<div class="test-entry-row"><span>Taille cible (± 8,5cm)</span><span>${cible.toFixed(0)} cm</span></div>`);
    if(p.taille_cm){
      const pct = ((p.taille_cm / cible) * 100).toFixed(0);
      rows.push(`<div class="test-entry-row"><span>% taille cible atteinte</span><span>${pct}%</span></div>`);
    }
  }

  return rows.join('');
}

function drawTestChart(canvasId, entries){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const w = rect.width, h = rect.height, pad = 6;

  const values = entries.map(e => e.valeur_brute);
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;

  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle = '#3DDC97';
  ctx.lineWidth = 2;
  ctx.beginPath();
  entries.forEach((e, i) => {
    const x = pad + (i / (entries.length - 1)) * (w - pad*2);
    const y = h - pad - ((e.valeur_brute - min) / range) * (h - pad*2);
    if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();

  ctx.fillStyle = '#3DDC97';
  entries.forEach((e, i) => {
    const x = pad + (i / (entries.length - 1)) * (w - pad*2);
    const y = h - pad - ((e.valeur_brute - min) / range) * (h - pad*2);
    ctx.beginPath();
    ctx.arc(x, y, 2.5, 0, Math.PI*2);
    ctx.fill();
  });
}

      onConfirm: async (v) => {
        if(!v.date_debut) return;
        await sb.from('injuries').insert({
          player_id: p.id, type: v.type, localisation: v.localisation, gravite: v.gravite,
          date_debut: v.date_debut, date_retour_prevue: v.date_retour_prevue || null,
          phase_actuelle: 'repos', notes: v.notes
        });
        await renderInjurySection(p);
      }
    });
  });

  if(active){
    document.getElementById('btn-update-phase').addEventListener('click', () => {
      openModal({
        title: 'Changer la phase RTP',
        fields: [
          {key:'phase_actuelle', label:'Phase actuelle', type:'select', value:active.phase_actuelle, options: PHASES.map(ph=>({value:ph.key,label:ph.label}))},
          {key:'date_retour_prevue', label:'Retour prévu', type:'date', value:active.date_retour_prevue||''}
        ],
        onConfirm: async (v) => {
          await sb.from('injuries').update({
            phase_actuelle: v.phase_actuelle,
            date_retour_prevue: v.date_retour_prevue || null,
            updated_at: new Date().toISOString()
          }).eq('id', active.id);
          await renderInjurySection(p);
        }
      });
    });

    document.getElementById('btn-close-injury').addEventListener('click', async () => {
      if(!confirm('Confirmer le retour à la compétition ?')) return;
      await sb.from('injuries').update({
        date_retour_reelle: new Date().toISOString().slice(0,10),
        phase_actuelle: 'retour_competition'
      }).eq('id', active.id);
      await renderInjurySection(p);
    });
  }
}

// ============================================================
// EXPORT PDF
// ============================================================
function exportPlayerPDF(p, tests){
  exportPlayerPDFAsync(p, tests);
}

async function exportPlayerPDFAsync(p, tests){
  const { data:injuries } = await sb.from('injuries').select('*').eq('player_id', p.id).order('date_debut', {ascending:false});
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const age = p.date_naissance ? Math.floor((Date.now() - new Date(p.date_naissance)) / 31557600000) : '?';
  let y = 20;

  doc.setFontSize(18);
  doc.text(`${p.prenom} ${p.nom}`, 14, y); y += 8;
  doc.setFontSize(11);
  doc.setTextColor(100);
  doc.text(`${age} ans${p.poste ? ' · ' + p.poste : ''}${p.pied_fort ? ' · pied ' + p.pied_fort : ''}`, 14, y); y += 6;
  doc.text(`Exporté le ${new Date().toLocaleDateString('fr-FR')}`, 14, y); y += 12;

  doc.setTextColor(0);
  doc.setFontSize(13);
  doc.text('Anthropométrie', 14, y); y += 7;
  doc.setFontSize(10.5);
  doc.setTextColor(60);
  doc.text(`Taille : ${p.taille_cm ? p.taille_cm + ' cm' : '—'}`, 14, y); y += 5.5;
  doc.text(`Poids : ${p.poids_kg ? p.poids_kg + ' kg' : '—'}`, 14, y); y += 5.5;
  if(p.taille_cm && p.poids_kg){
    const imc = (p.poids_kg / Math.pow(p.taille_cm/100,2)).toFixed(1);
    doc.text(`IMC : ${imc}`, 14, y); y += 5.5;
  }
  if(p.taille_pere_cm && p.taille_mere_cm && p.sexe){
    const cible = p.sexe === 'garcon' ? (p.taille_pere_cm+p.taille_mere_cm+13)/2 : (p.taille_pere_cm+p.taille_mere_cm-13)/2;
    doc.text(`Taille cible estimée : ${cible.toFixed(0)} cm (± 8,5 cm)`, 14, y); y += 5.5;
  }
  const mat = calcMaturityOffset(p);
  if(mat){
    doc.text(`Âge estimé au pic de croissance (PHV) : ${mat.ageAuPHV.toFixed(1)} ans`, 14, y); y += 5.5;
  }
  y += 6;

  doc.setTextColor(0);
  doc.setFontSize(13);
  doc.text('Tests physiques — derniers résultats', 14, y); y += 7;
  doc.setFontSize(10.5);
  doc.setTextColor(60);
  TEST_TYPES.forEach(t => {
    const entries = tests.filter(x => x.type_test === t.key);
    if(entries.length){
      const latest = entries[entries.length-1];
      doc.text(`${t.label} : ${latest.valeur_brute} ${t.unite} (${new Date(latest.date).toLocaleDateString('fr-FR')})`, 14, y);
      y += 5.5;
    }
  });
  y += 6;

  const active = (injuries||[]).find(i => !i.date_retour_reelle);
  const historique = (injuries||[]).filter(i => i.date_retour_reelle);

  if(y > 250){ doc.addPage(); y = 20; }
  doc.setTextColor(0);
  doc.setFontSize(13);
  doc.text('Blessures', 14, y); y += 7;
  doc.setFontSize(10.5);
  doc.setTextColor(60);

  if(active){
    const phaseLabel = PHASES.find(ph => ph.key === active.phase_actuelle)?.label || active.phase_actuelle;
    doc.text(`En cours : ${active.type || ''}${active.localisation ? ' — ' + active.localisation : ''} (${phaseLabel})`, 14, y); y += 5.5;
    if(active.date_retour_prevue){
      doc.text(`Retour prévu le ${new Date(active.date_retour_prevue).toLocaleDateString('fr-FR')}`, 14, y); y += 5.5;
    }
  } else {
    doc.text('Aucune blessure active — apte.', 14, y); y += 5.5;
  }

  if(historique.length){
    y += 2;
    doc.text('Historique :', 14, y); y += 5.5;
    historique.forEach(i => {
      if(y > 280){ doc.addPage(); y = 20; }
      doc.text(`- ${i.type || '—'}${i.localisation ? ' (' + i.localisation + ')' : ''} : ${new Date(i.date_debut).toLocaleDateString('fr-FR')} → ${new Date(i.date_retour_reelle).toLocaleDateString('fr-FR')}`, 14, y);
      y += 5.5;
    });
  }

  doc.save(`fiche_${p.nom}_${p.prenom}.pdf`);
}

function openAddPlayerModal(){
  openModal({
    title: 'Nouveau joueur',
    fields: [
      {key:'prenom', label:'Prénom', type:'text'},
      {key:'nom', label:'Nom', type:'text'},
      {key:'date_naissance', label:'Date de naissance', type:'date'},
      {key:'poste', label:'Poste', type:'select', options:[
        {value:'gardien', label:'Gardien'},
        {value:'defenseur', label:'Défenseur'},
        {value:'milieu', label:'Milieu'},
        {value:'attaquant', label:'Attaquant'}
      ]},
      {key:'pied_fort', label:'Pied fort', type:'select', options:[
        {value:'droit', label:'Droit'},
        {value:'gauche', label:'Gauche'},
        {value:'ambidextre', label:'Ambidextre'}
      ]}
    ],
    onConfirm: async (v) => {
      if(!v.prenom.trim() || !v.nom.trim() || !v.date_naissance) return;
      const cat = allCategories.find(c => c.id === currentCategorieId);
      await sb.from('players').insert({
        club_id: cat.club_id,
        categorie_id: currentCategorieId,
        prenom: v.prenom.trim(),
        nom: v.nom.trim(),
        date_naissance: v.date_naissance,
        poste: v.poste,
        pied_fort: v.pied_fort
      });
      renderJoueurs();
    }
  });
}
